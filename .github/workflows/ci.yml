name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install into a scratch HOME
        env:
          HOME: ${{ runner.temp }}/home
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME"
          ./install.sh --prefix "$HOME/bin" --skip-notarization
          "$HOME/bin/lark-cli" --version
          entries=$(find "$HOME" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          echo "top-level entries under scratch HOME: $entries"
          test "$entries" -eq 1
      - name: Reinstall is idempotent
        env:
          HOME: ${{ runner.temp }}/home
          GH_TOKEN: ${{ github.token }}
        run: ./install.sh --prefix "$HOME/bin" --skip-notarization

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Exactly one skill is discoverable
        run: |
          npx -y skills add . --list
